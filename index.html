function addRow(k){doc[k].push(heads[k].map((_,i)=>k!=='extension'&&i===0?String(doc[k].length+1):''));document.getElementById('paper').outerHTML=paper()}
const UNIT_PASSWORDS={'ЦРК':'1212'};let unitLoggedIn=false,pendingUnitView='unit';
function showUnitLogin(target='unit'){pendingUnitView=target;view='login';document.getElementById('main').innerHTML='<div class="crumb">Актюбинский ДЭСД / ЦТО МС / ЦРК</div><div class="card"><h1>Вход в ЦРК</h1><p>Введите пароль подразделения.</p><form onsubmit="event.preventDefault();loginUnit()"><label for="unitPassword">Пароль ЦРК</label><input id="unitPassword" type="password" autocomplete="current-password" required style="display:block;width:100%;max-width:320px;padding:12px;margin:12px 0;border:1px solid #a9c4d7;border-radius:7px"><p id="loginError" role="alert" style="color:#b3261e"></p><button class="primary" type="submit">Войти</button> <button type="button" onclick="show(\'dept\')">Назад</button></form></div>';document.getElementById('unitPassword').focus()}
async function loginUnit(){const input=document.getElementById('unitPassword'),password=input.value;try{if(sharedApi()){const result=await ndApi('login',{subunit:'ЦРК',password});cloudToken=result.token;await loadCloudRecords()}else if(password!==UNIT_PASSWORDS['ЦРК'])throw new Error('Неверный пароль');unitLoggedIn=true;document.getElementById('unitLogout').hidden=false;show(pendingUnitView)}catch(e){document.getElementById('loginError').textContent=e.message;input.select()}}
function logoutUnit(){cloudToken='';unitLoggedIn=false;current=null;doc=null;document.getElementById('unitLogout').hidden=true;show('dept')}
function show(v){if(['unit','editor','registry','detail'].includes(v)&&!unitLoggedIn)return showUnitLogin(v);view=v;const m=document.getElementById('main'),crumb='<div class="crumb">Главная / Актюбинский ДЭСД / ЦТО МС / ЦРК</div>';document.getElementById('count').textContent=records.length;if(v==='home')m.innerHTML='<div class="crumb">ДОКУМЕНТООБОРОТ</div><h1>Открытие наряд-допуска</h1><p class="muted">Выберите подразделение, чтобы открыть форму.</p><button class="choice" onclick="show(\'desd\')"><strong>Актюбинский ДЭСД ›</strong><small>ЦТО МС · ЦРК</small></button><div class="stats"><div>Открыты<strong>'+records.filter(r=>r.status==='open').length+'</strong></div><div>Подписаны<strong>'+records.filter(r=>r.status==='signed').length+'</strong></div><div>Закрыты<strong>'+records.filter(r=>r.status==='closed').length+'</strong></div></div>';if(v==='desd')m.innerHTML=crumb+'<h1>Актюбинский ДЭСД</h1><button class="choice" onclick="show(\'dept\')"><strong>ЦТО МС ›</strong><small>Центр технического обслуживания местных сетей</small></button>';if(v==='dept')m.innerHTML=crumb+'<h1>ЦТО МС</h1><button class="choice" onclick="show(\'unit\')"><strong>ЦРК ›</strong><small>Наряд-допуск на выполнение работ повышенной опасности</small></button>';if(v==='unit')m.innerHTML=crumb+'<h1>ЦРК · ЦТО МС</h1><button class="primary" onclick="create()">＋ Открыть наряд-допуск</button> <button class="primary" onclick="show(\'registry\')">Реестр</button>';if(v==='editor')m.innerHTML=crumb+'<div class="bar no-print"><div><h1>Наряд-допуск '+(doc.fields.number?'№ '+esc(doc.fields.number):'')+'</h1><p class="muted">Голубые поля редактируются прямо на листе.</p></div><div class="actions"><button class="primary" onclick="savePermit()">Сохранить и открыть</button><button onclick="downloadWord()">Word</button></div></div><div class="meta no-print">Телефон производителя работ <input id="phone" type="tel" value="'+esc(doc.phone)+'" placeholder="+7 7XX XXX XX XX"> <span class="smallnote">После сохранения вложения добавляются в карточке.</span></div>'+paper()+'<div class="actions no-print"><button class="primary" onclick="savePermit()">Сохранить и открыть наряд</button></div>';if(v==='registry')m.innerHTML=crumb+'<div class="bar"><h1>Реестр нарядов</h1><button onclick="refreshCloudRegistry()">↻ Обновить</button><button class="primary" onclick="create()">＋ Новый наряд</button></div><div class="registry">'+(records.length?records.slice().reverse().map(r=>'<button class="row" onclick="openPermit(\''+r.id+'\')"><strong>№ '+esc(r.doc.fields.number)+'</strong><span>'+esc(r.doc.fields.worksite)+'</span><span>'+esc(r.doc.fields.producer)+'</span><span class="status '+r.status+'">'+({open:'Открыт',signed:'Подписан',closed:'Закрыт'}[r.status])+'</span></button>').join(''):'<p class="muted" style="padding:20px">Сохраненных нарядов пока нет.</p>')+'</div>';if(v==='detail')renderDetail()}
function create(){if(!unitLoggedIn)return showUnitLogin('unit');current=null;doc=blank();show('editor')}async function savePermit(){if(cloudSaving)return;doc.phone=document.getElementById('phone').value.trim();if(!doc.fields.number.trim()||!doc.fields.producer.trim()){toast('Заполните номер и производителя работ');return}if(current){const r=records.find(r=>r.id===current);r.doc=JSON.parse(JSON.stringify(doc))}else{current=crypto.randomUUID();records.push({id:current,doc:JSON.parse(JSON.stringify(doc)),status:'open',files:[],createdAt:Date.now()})}const r=records.find(x=>x.id===current);r.dirty=true;if(!saveLocal())return;document.getElementById('count').textContent=records.length;await syncPermit(r,buildWordBlob());}
function openPermit(id){if(!unitLoggedIn)return showUnitLogin('registry');current=id;const r=records.find(x=>x.id===id);if(!r)return;doc=JSON.parse(JSON.stringify(r.doc));show('detail')}
function renderDetail(){const r=records.find(x=>x.id===current),m=document.getElementById('main');if(!r)return show('registry');const files=r.files||[];m.innerHTML='<div class="crumb">Актюбинский ДЭСД / ЦТО МС / ЦРК</div><div class="bar"><div><h1>Наряд-допуск № '+esc(r.doc.fields.number)+'</h1><span class="status '+r.status+'">'+({open:'Открыт',signed:'Подписан',closed:'Закрыт'}[r.status])+'</span><p class="smallnote">'+(r.cloudRevision&&!r.dirty?'✅ Передан на второй сайт':r.dirty?'⏳ Есть изменения, которые ещё не отправлены':'⏳ Пока сохранён только на этом компьютере')+'</p></div><button class="primary" onclick="show(\'editor\')">Редактировать бланк</button></div><div class="detailgrid"><div><small>Производитель работ</small><strong>'+esc(r.doc.fields.producer)+'</strong></div><div><small>Место работ</small><strong>'+esc(r.doc.fields.worksite)+'</strong></div><div><small>Связь с бригадой</small><strong>'+(r.doc.phone?'<a href="tel:'+esc(r.doc.phone.replace(/[^\d+]/g,''))+'">☎ '+esc(r.doc.phone)+'</a>':'Телефон не указан')+'</strong><button onclick="editPermitPhone()">Указать / изменить телефон</button></div></div><div class="notice '+(files.some(f=>f.kind==='signed')?'ok':'')+'">'+(files.some(f=>f.kind==='signed')?'Подписанный наряд загружен.':'После распечатки и подписания сотрудниками загрузите скан или фото подписанного наряда.')+'</div><h2>Файлы наряда</h2><div class="files">'+(files.length?files.map((f,i)=>f.id?'<button class="primary" onclick="openRemoteFile('+i+')">'+esc(f.name)+' — '+(f.kind==='signed'?'подписанный наряд':'фото работ')+'</button>':'<a download="'+esc(f.name)+'" href="'+f.data+'">'+esc(f.name)+' — '+(f.kind==='signed'?'подписанный наряд':'фото работ')+'</a>').join(''):'<p class="muted">Файлы пока не добавлены.</p>')+'</div><div class="upload"><select id="kind"><option value="photo">Фотография работ</option><option value="signed">Подписанный наряд</option></select><input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><button onclick="addFile()">Загрузить</button></div><p class="smallnote">После нажатия «Загрузить» файл отправляется в общую базу и становится доступен на втором сайте. Максимум — 5 МБ.</p><button class="primary" onclick="sendCurrentPermit()">Отправить / обновить на втором сайте</button>'+(r.status!=='closed'?'<button class="primary" onclick="closePermit()">Закрыть наряд</button>':'')}
async function addFile(){if(cloudSaving)return;const f=document.getElementById('file').files[0],kind=document.getElementById('kind').value;if(!f)return toast('Выберите файл');if(!['image/jpeg','image/png','image/webp','application/pdf'].includes(f.type))return toast('Допустимы JPG, PNG, WebP и PDF');if(f.size>(sharedApi()?5:1)*1024*1024)return toast('Файл слишком большой: максимум '+(sharedApi()?5:1)+' МБ');const r=records.find(x=>x.id===current);try{const data=await fileAsDataUrl(f);if(sharedApi()){if(!r.cloudRevision||r.dirty){if(!await ensurePermitCloud(r.id))throw new Error('Наряд не отправлен. Проверьте подключение и повторите загрузку.')}cloudSaving=true;const res=await ndApi('upload_file',{id:r.id,kind,name:f.name,mime:f.type,base64:data});applyRemote(res.permit);toast('Фото / подписанный наряд отправлен на второй сайт');}else{r.files.push({name:f.name,kind,data});if(kind==='signed')r.status='signed';saveLocal();toast('Вложение сохранено на этом компьютере');}renderDetail()}catch(e){toast(e.message)}finally{cloudSaving=false}}
async function closePermit(){if(cloudSaving)return;const r=records.find(x=>x.id===current);r.status='closed';r.dirty=true;saveLocal();if(sharedApi())await syncPermit(r);renderDetail()}
function xml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}
function zipParts(files){const enc=new TextEncoder(),chunks=[],central=[];let offset=0;for(const [name,body] of files){const nb=enc.encode(name),data=body instanceof Uint8Array?body:enc.encode(body),crc=crc32(data);const lh=new Uint8Array(30),l=new DataView(lh.buffer);l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint32(14,crc,true);l.setUint32(18,data.length,true);l.setUint32(22,data.length,true);l.setUint16(26,nb.length,true);chunks.push(lh,nb,data);const ch=new Uint8Array(46),c=new DataView(ch.buffer);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,offset,true);central.push(ch,nb);offset+=lh.length+nb.length+data.length}const centralLength=central.reduce((n,x)=>n+x.length,0),end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,centralLength,true);e.setUint32(16,offset,true);chunks.push(...central,end);return new Blob(chunks,{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}
function runs(node,bold=false){if(node.nodeType===3)return node.nodeValue?'<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>'+(bold?'<w:b/>':'')+'</w:rPr><w:t xml:space="preserve">'+xml(node.nodeValue)+'</w:t></w:r>':'';if(node.nodeType!==1)return '';if(node.tagName==='BR')return '<w:r><w:br/></w:r>';if(node.tagName==='INPUT')return '<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/></w:rPr><w:t xml:space="preserve">'+xml(node.value||' ')+'</w:t></w:r>';const b=bold||['B','STRONG'].includes(node.tagName);if(node.classList?.contains('edit')&&node.closest('.measure'))return '<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:u w:val="single"/></w:rPr><w:t xml:space="preserve">'+xml(node.textContent.trim()||'________________________________________')+'</w:t></w:r>';return Array.from(node.childNodes).map(n=>runs(n,b)).join('')}
function para(el){const tag=el.tagName;const align=tag==='H2'||tag==='H3'?'center':el.classList.contains('appendix')?'right':'left';const before=tag==='H2'||tag==='H3'?150:0;const after=tag==='H2'||tag==='H3'?150:70;const size=tag==='H2'||tag==='H3'?22:21;return '<w:p><w:pPr><w:jc w:val="'+align+'"/><w:spacing w:before="'+before+'" w:after="'+after+'" w:line="250" w:lineRule="auto"/><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="'+size+'"/></w:rPr></w:pPr>'+runs(el)+'</w:p>'}
function tableXml(table){const rows=Array.from(table.rows),n=rows[0]?.cells.length||1,width=Math.floor(10318/n);return '<w:tbl><w:tblPr><w:tblW w:w="10318" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblBorders><w:top w:val="single" w:sz="5"/><w:left w:val="single" w:sz="5"/><w:bottom w:val="single" w:sz="5"/><w:right w:val="single" w:sz="5"/><w:insideH w:val="single" w:sz="5"/><w:insideV w:val="single" w:sz="5"/></w:tblBorders></w:tblPr><w:tblGrid>'+Array.from({length:n},()=>'<w:gridCol w:w="'+width+'"/>').join('')+'</w:tblGrid>'+rows.map(row=>'<w:tr>'+Array.from(row.cells).map(cell=>'<w:tc><w:tcPr><w:tcW w:w="'+width+'" w:type="dxa"/></w:tcPr><w:p><w:pPr><w:spacing w:after="0"/><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="17"/></w:rPr></w:pPr>'+runs(cell,cell.tagName==='TH')+'</w:p></w:tc>').join('')+'</w:tr>').join('')+'</w:tbl>'}
function qrWordXml(){return '<w:p><w:pPr><w:jc w:val="right"/><w:spacing w:after="80"/></w:pPr><w:r><w:drawing><wp:inline xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" distT="0" distB="0" distL="0" distR="0"><wp:extent cx="720000" cy="720000"/><wp:docPr id="1" name="QR code"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="0" name="qr.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rId3" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="720000" cy="720000"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>'}function qrBytes(){const b=atob(document.querySelector('.appendix .qr').src.split(',')[1]);return Uint8Array.from(b,c=>c.charCodeAt(0))}
function buildWordBlob(){const pages=Array.from(document.querySelectorAll('#paper .page'));if(!pages.length)return;let body='';pages.forEach((page,i)=>{if(i)body+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';Array.from(page.children).forEach(el=>{if(el.classList.contains('tablewrap'))body+=tableXml(el.querySelector('table'));else if(el.classList.contains('appendix')){body+=qrWordXml();const copy=el.cloneNode(true);copy.querySelector('img')?.remove();body+=para(copy)}else if(['P','H2','H3','DIV'].includes(el.tagName))body+=para(el)})});const documentXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838" w:orient="portrait"/><w:pgMar w:top="794" w:right="794" w:bottom="794" w:left="794" w:header="360" w:footer="360" w:gutter="0"/></w:sectPr></w:body></w:document>';const files=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>'],['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],['word/document.xml',documentXml],['word/media/qr.png',qrBytes()],['word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/qr.png"/></Relationships>'],['word/settings.xml','<?xml version="1.0" encoding="UTF-8"?><w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:view w:val="print"/><w:zoom w:percent="100"/></w:settings>'],['word/styles.xml','<?xml version="1.0" encoding="UTF-8"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="21"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="70"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>']];return zipParts(files)}
let cloudToken='',cloudSaving=false;const SHARED_API_KEY='nd_shared_api_v3';const DEFAULT_SHARED_API='https://script.google.com/macros/s/AKfycbzV-metZZySnJj8dtbZGyQXG4LMHMLBVz-4o1hKRfEp1eEQKS_m3cwt_WTz4schEE0W/exec';
function sharedApi(){return localStorage.getItem(SHARED_API_KEY)??DEFAULT_SHARED_API}
function validSharedApi(url){return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)}
async function ndApi(action,data=null){const url=sharedApi();if(!url)throw new Error('Адрес общей базы не задан.');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),90000);try{const response=await fetch(data?url:url+'?'+new URLSearchParams({action,token:cloudToken,t:Date.now()}),data?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:cloudToken,...data}),signal:controller.signal}:{cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('Сервис недоступен: HTTP '+response.status);const result=await response.json();if(!result.ok)throw new Error(result.error||'Ошибка общей базы');return result}catch(e){if(e.name==='AbortError')throw new Error('Нет ответа от общей базы. Запись осталась локально; повторите сохранение.');throw e}finally{clearTimeout(timer)}}
function toLocal(remote){return {id:remote.id,doc:remote.doc,status:{OPEN:'open',SIGNED:'signed',CLOSED:'closed'}[remote.status]||'open',files:remote.files||[],word:remote.word,createdAt:Number(remote.createdAt),cloudRevision:remote.revision,cloudApi:sharedApi(),dirty:false}}
function applyRemote(remote){const r=toLocal(remote),index=records.findIndex(x=>x.id===r.id);if(index<0)records.push(r);else records[index]=r;saveLocal();return r}
async function loadCloudRecords(overwriteDirty=false){const result=await ndApi('list_permits');for(const remote of result.permits){const local=records.find(x=>x.id===remote.id);if(overwriteDirty||!local?.dirty)applyRemote(remote)}saveLocal()}
async function refreshCloudRegistry(){if(!sharedApi())return toast('Общая база пока не подключена.');try{let overwrite=false;if(records.some(r=>r.dirty&&r.cloudRevision)){overwrite=confirm('Есть несохранённые правки отправленных нарядов. Загрузить серверные версии? Копия текущих правок останется в резерве этого браузера.');if(!overwrite)return;localStorage.setItem(KEY+'_conflict_backup',JSON.stringify(records.filter(r=>r.dirty)))}await loadCloudRecords(overwrite);show('registry');toast('Реестр обновлён')}catch(e){toast(e.message)}}
function fileAsDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Не удалось прочитать файл'));reader.readAsDataURL(blob)})}
async function syncPermit(r,wordBlob=null){const pendingFiles=(r.files||[]).filter(f=>!f.id&&f.data).slice();if(!sharedApi()){toast('Сохранено на компьютере. Общая база отключена.');return false}if(!cloudToken){toast('Для отправки войдите в ЦРК снова. Запись сохранена локально.');return false}cloudSaving=true;toast('Сохраняю наряд в общей базе…');try{const result=await ndApi('upsert_permit',{expected_revision:r.cloudApi===sharedApi()?(r.cloudRevision||0):0,permit:{id:r.id,doc:r.doc,status:{open:'OPEN',signed:'SIGNED',closed:'CLOSED'}[r.status]},word_base64:wordBlob?(await fileAsDataUrl(wordBlob)).split(',')[1]:undefined});const remote=applyRemote(result.permit);while(pendingFiles.length){const file=pendingFiles[0];const result=await ndApi('upload_file',{id:r.id,kind:file.kind,name:file.name,mime:file.data.split(';')[0].slice(5),base64:file.data});applyRemote(result.permit);pendingFiles.shift()}toast('Наряд отправлен. Уведомление появится на карте при следующем обновлении.');return true}catch(e){const local=records.find(x=>x.id===r.id)||r;local.dirty=true;for(const file of pendingFiles){if(!local.files.includes(file))local.files.push(file)}saveLocal();toast('Не отправлено: '+e.message);return false}finally{cloudSaving=false}}
async function openRemoteFile(i){try{const r=records.find(x=>x.id===current),file=r.files[i],result=await fetchRemoteFile(r.id,file.id);downloadCloudFile(result)}catch(e){toast(e.message)}}
async function fetchRemoteFile(id,file_id){const response=await fetch(sharedApi()+'?'+new URLSearchParams({action:'read_file',token:cloudToken,id,file_id}));const result=await response.json();if(!result.ok)throw new Error(result.error);return result}
function downloadCloudFile(result){const raw=atob(result.base64),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),blob=new Blob([bytes],{type:result.mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=result.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function downloadWord(){const blob=buildWordBlob();if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Наряд-допуск-'+(doc.fields.number||'новый')+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}

async function ensurePermitCloud(id){const r=records.find(x=>x.id===id);if(!r)return false;doc=JSON.parse(JSON.stringify(r.doc));current=id;show('editor');let ok=false;try{ok=await syncPermit(r,buildWordBlob());return ok}finally{show('detail')}}
async function sendCurrentPermit(){if(cloudSaving)return;await ensurePermitCloud(current)}
async function editPermitPhone(){if(cloudSaving)return;const r=records.find(x=>x.id===current),value=prompt('Номер телефона производителя работ',r.doc.phone||'');if(value===null)return;r.doc.phone=value.trim();r.dirty=true;doc=JSON.parse(JSON.stringify(r.doc));saveLocal();if(sharedApi())await ensurePermitCloud(r.id);else renderDetail()}

document.addEventListener('focusout',e=>{const el=e.target;if(el.matches?.('[data-field]')&&doc)doc.fields[el.dataset.field]=el.innerText.trim()});document.addEventListener('input',e=>{const el=e.target;if(el.matches?.('[data-table]')&&doc)doc[el.dataset.table][+el.dataset.row][+el.dataset.col]=el.value});show('home');
</script></body></html>
